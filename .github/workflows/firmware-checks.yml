name: Firmware checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  push:
    branches:
      - main
      - feature/timetable-template
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare fictional timetable and fonts
        run: |
          npm install --global pnpm@10.17.1
          pnpm install --frozen-lockfile --ignore-scripts
          python3 tools/prepare_timetable.py examples/timetable.ics

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and verify merged firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware
